[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sclmct"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "anndata",
    "h5py",
    "matplotlib",
    "numpy",
    "pandas",
    "pytorch_lightning==2.5.3",
    "scanpy",
    "scikit_learn",
    "seaborn",
    "torch==2.5.1",
    "transformers==4.55.3",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["sclmct"]
