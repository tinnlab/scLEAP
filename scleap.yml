name: scleap

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  - pyyaml
  - pyarrow
  - h5py
  - pip:
      - anndata
      - scanpy
      - transformers
      - huggingface-hub
      - tokenizers
      - safetensors
      - pytorch-lightning
      - umap-learn
      - statsmodels